{% extends "base.html" %}
{% block title %}Payment link not found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h4 class="mb-2">This payment link isn't valid</h4>
                <p class="text-muted mb-0">
                    It may have expired, or the invoice it points to no longer exists.
                    Please contact the dairy for a new payment link.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
