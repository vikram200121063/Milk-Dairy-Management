{# Shared date-range picker. Expects: range_choices, range_type, range_label,
   custom_from, custom_to, today. #}
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <form method="GET" class="row g-2 align-items-end">
            <div class="col-sm-3">
                <label class="form-label small mb-1">Range</label>
                <select name="range" class="form-select" onchange="toggleCustomRange(this.value)">
                    {% for value, label in range_choices %}
                    <option value="{{ value }}" {% if range_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-sm-3 custom-range-field {{ 'd-none' if range_type != 'custom' }}">
                <label class="form-label small mb-1">From</label>
                <input type="date" name="from" class="form-control" value="{{ custom_from }}" max="{{ today }}">
            </div>
            <div class="col-sm-3 custom-range-field {{ 'd-none' if range_type != 'custom' }}">
                <label class="form-label small mb-1">To</label>
                <input type="date" name="to" class="form-control" value="{{ custom_to }}" max="{{ today }}">
            </div>
            <div class="col-sm-3">
                <button type="submit" class="btn btn-primary w-100">Apply</button>
            </div>
        </form>
        <div class="text-muted small mt-2">Showing figures for: <strong>{{ range_label }}</strong></div>
    </div>
</div>
<script>
    function toggleCustomRange(value) {
        document.querySelectorAll('.custom-range-field').forEach((el) => {
            el.classList.toggle('d-none', value !== 'custom');
        });
    }
</script>
