{% extends "base.html" %}
{% block title %}Login - OM Dairy{% endblock %}

{% block content %}
<div class="login-shell">
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 pt-5">
                <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="OM Dairy" class="login-logo">
                <div class="login-title">OM Dairy</div>
                <div class="login-subtitle">Milk collection &amp; payment management</div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                            autofocus
                        >
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
