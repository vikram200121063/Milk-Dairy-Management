{% extends "base.html" %}
{% block title %}Customer Login - OM Dairy{% endblock %}

{% block content %}
<div class="login-shell">
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 pt-5">
                <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="OM Dairy" class="login-logo">
                <div class="login-title">OM Dairy</div>
                <div class="login-subtitle">Customer portal &ndash; your milk records &amp; invoices</div>

                <form method="POST" action="{{ url_for('customer_portal.login') }}">
                    <div class="mb-3">
                        <label for="mobile_number" class="form-label">Mobile Number</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="mobile_number"
                            name="mobile_number"
                            inputmode="numeric"
                            pattern="[6-9][0-9]{9}"
                            maxlength="10"
                            required
                            autofocus
                        >
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">New customer?</span>
                    <a href="{{ url_for('customer_portal.register') }}" class="small d-block mt-1">
                        Create your account →
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="small d-block mt-2 text-muted">
                        Dairy staff login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
